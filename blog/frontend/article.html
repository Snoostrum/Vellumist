<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="文章详情 — 不如睡觉" />
    <title>文章 — 不如睡觉</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <script src="js/vendor/marked.min.js"></script>
  </head>
  <body>
    <!-- 顶部品牌 -->
    <div class="topbar">
      <a href="index.html" class="topbar-brand">不如睡觉</a>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <a href="articles.html" class="back-link">← 返回文章列表</a>
      <article class="article-detail fade-section" id="article-detail"></article>

      <!-- 评论区 -->
      <section class="comment-section fade-section" id="comment-section">
        <h2 class="comment-title">💬 评论（<span id="comment-count">0</span>）</h2>
        <div id="comment-list" class="comment-list"></div>
        <form id="comment-form" class="comment-form" autocomplete="off">
          <input
            type="text"
            id="comment-author"
            class="comment-input"
            placeholder="昵称（可选，≤30字）"
            maxlength="30"
          />
          <textarea
            id="comment-content"
            class="comment-textarea"
            placeholder="说点什么吧…（≤1000字）"
            maxlength="1000"
            required
          ></textarea>
          <div class="comment-form-row">
            <span id="comment-status" class="comment-status"></span>
            <button type="submit" class="btn-comment">发表评论</button>
          </div>
        </form>
      </section>
    </main>

    <!-- 悬浮岛式侧边栏 -->
    <nav class="dock" id="dock" aria-label="功能导航"></nav>

    <script src="js/api.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/article.js"></script>
  </body>
</html>
