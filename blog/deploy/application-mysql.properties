server.port=8080

# MySQL 数据库（部署环境）
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=blog_user
# 密码通过环境变量注入，不要写死在文件里
spring.datasource.password=${BLOG_DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===== 安全配置 =====
# 生产必须设置强随机密钥，例如：export BLOG_JWT_SECRET=$(openssl rand -base64 48)
blog.jwt.secret=${BLOG_JWT_SECRET}
# 生产走 HTTPS，cookie 必须 Secure
blog.jwt.cookie-secure=${BLOG_JWT_COOKIE_SECURE:true}
# 同源部署留空即可；如前端部署在其他域名，配置白名单
blog.cors.allowed-origins=${BLOG_CORS_ALLOWED_ORIGINS:}
