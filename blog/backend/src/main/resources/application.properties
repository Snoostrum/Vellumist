server.port=8080

# ===== 上传限制 =====
# 音乐上传是「音频 + 封面」两个文件在同一个请求里，所以 max-request-size 必须大于
# max-file-size，否则会以 request too large 失败。
# 注意：Spring Boot 默认值只有 1MB / 10MB —— 不在这里显式配置的话，大文件在进入
# Controller 之前就会被 Tomcat 拒绝，前端只能看到一句含糊的「上传失败」。
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB

# H2 数据库（开发环境）
spring.datasource.url=jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# 启动时执行 schema.sql 和 data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===== 安全配置 =====
# JWT 签名密钥（HS256 需 ≥32 字节）。此默认值仅供本地开发，
# 生产环境必须通过环境变量 BLOG_JWT_SECRET 覆盖！
blog.jwt.secret=${BLOG_JWT_SECRET:dev-only-secret-9c2f4e7a-1b3d-4f5e-8a6b-0c9d8e7f6a5b}
# 登录 cookie 是否仅 HTTPS 传输（生产开启；本地 http 开发必须为 false）
blog.jwt.cookie-secure=${BLOG_JWT_COOKIE_SECURE:false}
# 允许跨域的前端来源（逗号分隔；留空 = 仅同源）。跨端口开发时填写，如 http://localhost:8081
blog.cors.allowed-origins=${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:8081}

# 首次启动（users 表为空）时自动创建初始管理员；密码为空则随机生成并打印到日志
blog.admin.init-password=${BLOG_ADMIN_PASSWORD:}
